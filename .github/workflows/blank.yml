
name: MyKO APK Build FIXED

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify SDK
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager

      - name: Install SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyKO-Forward-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
